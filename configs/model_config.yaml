model:
  type: "xgboost"
  objective: "multi:softprob"
  eval_metric: "mlogloss"
  random_state: 42
  n_estimators: 250
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.80
  min_child_weight: 3
  gamma: 0.1

cross_validation:
  strategy: "SpatialGroupKFold"
  n_splits: 5
  group_column: "spatial_zone_id"

class_balancing:
  method: "sample_weight" # sample_weight or class_weight
  custom_weights:
    0: 1.0
    1: 3.5
    2: 8.0

optuna:
  n_trials: 35
  timeout_seconds: 600
  metric: "fatal_recall"  # maximize fatal-class recall while constraining macro-f1
